[package]
name = "elwindui-core"
version.workspace = true
edition.workspace = true

[dependencies]
elwindui-macros = { path = "../elwindui-macros" }
flo_curves = "0.8.0"
# Background async runtime for #[async_computed]/spawn_background — installed automatically by
# #[elwindui::main] (elwindui_macros::main). See docs/design/runtime/state_management_design.md
# "Async work" and Issue #82's Design summary for the decision to make this an official,
# always-on dependency rather than requiring each app to wire up its own runtime.
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
# "time" is test-only (a deterministic delay for the cross-thread wake verification spike,
# tests/spawn_local_cross_thread_wake.rs) — not requested by `[dependencies]` above, so it is not
# pulled into a downstream consumer's non-test build.
tokio = { version = "1", features = ["time"] }

[lints]
workspace = true
