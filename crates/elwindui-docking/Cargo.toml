[package]
name = "elwindui-docking"
version.workspace = true
edition.workspace = true

[dependencies]
elwindui-core = { path = "../elwindui-core" }
elwindui-macros = { path = "../elwindui-macros" }
elwindui-custom-controls = { path = "../elwindui-custom-controls" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
elwindui-backend-appkit = { path = "../elwindui-backend-appkit" }

[target.'cfg(target_os = "windows")'.dependencies]
elwindui-backend-winui3 = { path = "../elwindui-backend-winui3" }

[lints]
workspace = true
