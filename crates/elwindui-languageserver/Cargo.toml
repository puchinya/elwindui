[package]
name = "elwindui-languageserver"
version.workspace = true
edition.workspace = true

[dependencies]
elwindui-codegen = { path = "../elwindui-codegen" }
lsp-server = "0.7"
lsp-types = "0.97"
serde_json = "1"
syn = { version = "2", features = ["full"] }
# "span-locations" is what gives syn::Error::span() a real line/column outside an actual
# proc-macro invocation (diagnostics.rs's own syntax-error reporting) — off by default in
# proc-macro2's non-macro "fallback" mode. Cargo feature unification means enabling it here also
# turns it on for elwindui-codegen/elwindui-macros' own proc-macro2 usage within this same build;
# harmless (it only adds tracking), and nothing there currently relies on the default-off state.
proc-macro2 = { version = "1", features = ["span-locations"] }
# lsp-types 0.97 dropped the old `url::Url` re-export in favor of its own low-level `Uri` (a thin
# `fluent_uri` wrapper with no `to_file_path`/`from_file_path`); `url` is added directly just for
# that well-tested file-path <-> URI conversion (percent-encoding, Windows drive letters, etc.)
# rather than hand-rolling it against `fluent_uri`'s lower-level API.
url = "2"

[lints]
workspace = true
