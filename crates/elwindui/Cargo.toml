[package]
name = "elwindui"
version.workspace = true
edition.workspace = true

[dependencies]
elwindui-core = { path = "../elwindui-core" }
elwindui-macros = { path = "../elwindui-macros" }
elwindui-i18n = { path = "../elwindui-i18n" }
elwindui-svg = { path = "../elwindui-svg", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
elwindui-backend-winui3 = { path = "../elwindui-backend-winui3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
elwindui-backend-appkit = { path = "../elwindui-backend-appkit", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
elwindui-backend-gtk4 = { path = "../elwindui-backend-gtk4", optional = true }

[dev-dependencies]
# "time" is test-only (a deterministic delay in tests/store_and_async_computed.rs's cross-thread
# #[async_computed] supersede check) — elwindui-core's own [dependencies] entry only requests
# "rt-multi-thread", so this feature is not pulled into a downstream consumer's non-test build.
tokio = { version = "1", features = ["time"] }
# Issue #129: a real second crate (depending back on `elwindui`, a Cargo-supported dev-dependency
# cycle since dev-dependencies never affect the library build itself) declaring a `pub`
# `#[elwindui::environment_key]`, so `tests/environment_field_cross_crate.rs`/
# `tests/environment_scope_cross_crate.rs` can prove `#[environment(some_crate::name)]`/
# `EnvironmentScope { some_crate::name: value }` actually cross a real crate boundary.
elwindui-environment-key-fixture = { path = "../elwindui-environment-key-fixture" }
# Issue #128: same dev-dependency-cycle pattern as the #129 fixture above, but proving
# `#[overridable]`/`#[overrides]` propagation along a class chain crosses real crate boundaries
# (base classes in `elwindui-bridge-fixture-iface`, a descendant in
# `elwindui-bridge-fixture-backend`, further `#[overrides]` descendants here in
# `tests/class_chain_cross_crate.rs`) — the shape of a native control's chain (Core's
# `NativeControl` -> Core's `Button` -> a generated component in a user crate), reproduced as a
# minimal, backend-independent fixture.
elwindui-bridge-fixture-backend = { path = "../elwindui-bridge-fixture-backend" }
# `tests/class_chain_cross_crate.rs` dispatches through crate A's own `*Ext` traits directly, so
# it needs crate A as a direct dev-dependency here too, not just transitively through crate B.
elwindui-bridge-fixture-iface = { path = "../elwindui-bridge-fixture-iface" }
# Issue #191: a real external generated-component crate used by downstream qualified-path DSL
# regressions. Like the other fixtures above, the dev-dependency cycle is Cargo-supported because
# it never participates in the facade library build itself.
elwindui-external-component-fixture = { path = "../elwindui-external-component-fixture" }
# The alias is intentional coverage for the external props-macro ABI: the macro path uses the
# first authored path segment, which may be a Cargo dependency alias rather than the package name.
external_component_fixture_alias = { package = "elwindui-external-component-alias-fixture", path = "../elwindui-external-component-alias-fixture" }
# Issue #166 (PR #311 review A/P2): real compile-fail fixtures with exact rustc diagnostics.
# Stable rustdoc `compile_fail,E....` doctests do not check the error code, so the private,
# non-inherited ancestor `#[state]` contract is verified against the compiler's own output.
trybuild = "1"

[features]
default = []
svg = ["dep:elwindui-svg"]
backend-winui3 = ["dep:elwindui-backend-winui3"]
backend-appkit = ["dep:elwindui-backend-appkit"]
render-stats = ["elwindui-backend-appkit?/render-stats"]
backend-gtk4 = ["dep:elwindui-backend-gtk4"]

[lints]
workspace = true

[[test]]
name = "control_template_window_rt4"
path = "tests/control_template_window_rt4.rs"
harness = false
required-features = ["backend-appkit"]

[[test]]
name = "window_lifetime_appkit"
path = "tests/window_lifetime_appkit.rs"
harness = false
required-features = ["backend-appkit"]
