[package]
name = "elwindui"
version.workspace = true
edition.workspace = true

[dependencies]
elwindui-core = { path = "../elwindui-core" }
elwindui-macros = { path = "../elwindui-macros" }
elwindui-i18n = { path = "../elwindui-i18n" }
elwindui-svg = { path = "../elwindui-svg", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
elwindui-backend-winui3 = { path = "../elwindui-backend-winui3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
elwindui-backend-appkit = { path = "../elwindui-backend-appkit", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
elwindui-backend-gtk4 = { path = "../elwindui-backend-gtk4", optional = true }

[dev-dependencies]
# "time" is test-only (a deterministic delay in tests/store_and_async_computed.rs's cross-thread
# #[async_computed] supersede check) — elwindui-core's own [dependencies] entry only requests
# "rt-multi-thread", so this feature is not pulled into a downstream consumer's non-test build.
tokio = { version = "1", features = ["time"] }

[features]
default = []
svg = ["dep:elwindui-svg"]
backend-winui3 = ["dep:elwindui-backend-winui3"]
backend-appkit = ["dep:elwindui-backend-appkit"]
render-stats = ["elwindui-backend-appkit?/render-stats"]
backend-gtk4 = ["dep:elwindui-backend-gtk4"]

[lints]
workspace = true
