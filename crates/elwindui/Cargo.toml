[package]
name = "elwindui"
version.workspace = true
edition.workspace = true

[dependencies]
elwindui-core = { path = "../elwindui-core" }
elwindui-macros = { path = "../elwindui-macros" }
elwindui-i18n = { path = "../elwindui-i18n" }
elwindui-svg = { path = "../elwindui-svg", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
elwindui-backend-winui3 = { path = "../elwindui-backend-winui3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
elwindui-backend-appkit = { path = "../elwindui-backend-appkit", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
elwindui-backend-gtk4 = { path = "../elwindui-backend-gtk4", optional = true }

[dev-dependencies]
# "time" is test-only (a deterministic delay in tests/store_and_async_computed.rs's cross-thread
# #[async_computed] supersede check) — elwindui-core's own [dependencies] entry only requests
# "rt-multi-thread", so this feature is not pulled into a downstream consumer's non-test build.
tokio = { version = "1", features = ["time"] }
# Issue #129: a real second crate (depending back on `elwindui`, a Cargo-supported dev-dependency
# cycle since dev-dependencies never affect the library build itself) declaring a `pub`
# `#[elwindui::environment_key]`, so `tests/environment_field_cross_crate.rs`/
# `tests/environment_scope_cross_crate.rs` can prove `#[environment(some_crate::name)]`/
# `EnvironmentScope { some_crate::name: value }` actually cross a real crate boundary.
elwindui-environment-key-fixture = { path = "../elwindui-environment-key-fixture" }
# Issue #128: same dev-dependency-cycle pattern as the #129 fixture above, but proving
# `#[overridable]`/`#[overrides]` propagation through a `struct_only` bridge crosses real crate
# boundaries (`trait_only` in `elwindui-bridge-fixture-iface`, `struct_only` in
# `elwindui-bridge-fixture-backend`, ordinary `#[overrides]` descendant here in
# `tests/class_bridge_cross_crate.rs`) — the same shape that originally exposed the bug in `Window`
# (`elwindui-core` trait_only -> each backend's struct_only -> a generated host-composition
# component), reproduced as a minimal, backend-independent fixture.
elwindui-bridge-fixture-backend = { path = "../elwindui-bridge-fixture-backend" }
# Issue #128 remediation (review finding A2): `tests/class_bridge_cross_crate.rs` dispatches through
# the real `BridgeFixtureInterfaceExt` (crate A's own interface trait) directly, not a backend-side
# `{ConcreteName}Ext` compatibility alias — needs crate A as a direct dev-dependency here too, not
# just transitively through the backend crate.
elwindui-bridge-fixture-iface = { path = "../elwindui-bridge-fixture-iface" }

[features]
default = []
svg = ["dep:elwindui-svg"]
backend-winui3 = ["dep:elwindui-backend-winui3"]
backend-appkit = ["dep:elwindui-backend-appkit"]
render-stats = ["elwindui-backend-appkit?/render-stats"]
backend-gtk4 = ["dep:elwindui-backend-gtk4"]

[lints]
workspace = true
